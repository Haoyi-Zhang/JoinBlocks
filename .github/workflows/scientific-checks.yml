name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded offline finite checks from the artifact-repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-output
          python -B --version > raw-output/python.txt 2>&1
          ulimit -v 3145728
          ulimit -t 900
          timeout --signal=TERM --kill-after=10s 900s bash -c '
            set -euo pipefail
            python -B -m unittest discover -s regressions -v > raw-output/key-regressions.stdout 2> raw-output/key-regressions.stderr
            python -B full_reproduction.py --output scientific-output > raw-output/reproduction.stdout 2> raw-output/reproduction.stderr
          '
      - name: Upload raw attempts and partial or completed scientific outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-outputs
          path: |
            raw-output/
            scientific-output/
          if-no-files-found: warn
          retention-days: 14
